<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>봉사 메모장</title>
    <style>
        :root { --primary: #5a67d8; --bg: #f7fafc; --white: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.2rem; }
        
        /* 달력 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day { padding: 10px 0; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .day:hover { background: #edf2f7; }
        .day.today { background: var(--primary); color: white; font-weight: bold; }
        .day.has-data { border-bottom: 3px solid var(--primary); }
        .weekday { font-weight: bold; color: #718096; margin-bottom: 10px; }

        /* 입력 폼 */
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .btn-secondary { background: #718096; margin-top: 5px; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 400px; }
    </style>
</head>
<body>

<div class="card">
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="width: auto; padding: 5px 10px;">◀</button>
        <h3 id="currentMonthYear"></h3>
        <button onclick="changeMonth(1)" style="width: auto; padding: 5px 10px;">▶</button>
    </div>
    <div class="calendar-grid weekday">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div id="calendar" class="calendar-grid"></div>
</div>

<div class="card">
    <h2>데이터 관리</h2>
    <button class="btn-secondary" onclick="exportData()">데이터 백업 (파일저장)</button>
</div>

<div id="modal">
    <div class="modal-content">
        <h2 id="selectedDateText">날짜 선택</h2>
        <input type="number" id="hours" placeholder="봉사 시간 (예: 2)" step="0.5">
        <input type="number" id="studies" placeholder="연구 건수">
        <textarea id="notes" placeholder="구역 번호, 가구 번호, 메모 등" rows="4"></textarea>
        <button onclick="saveData()">저장하기</button>
        <button class="btn-secondary" onclick="closeModal()">닫기</button>
    </div>
</div>

<script>
    let currentNavDate = new Date();
    let selectedDateStr = "";
    let serviceData = JSON.parse(localStorage.getItem('jw_service_data')) || {};

    function init() {
        renderCalendar();
        checkFirstOfMonth();
    }

    function renderCalendar() {
        const year = currentNavDate.getFullYear();
        const month = currentNavDate.getMonth();
        document.getElementById('currentMonthYear').innerText = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        const calendarDiv = document.getElementById('calendar');
        calendarDiv.innerHTML = "";

        for (let i = 0; i < firstDay; i++) calendarDiv.innerHTML += "<div></div>";

        for (let d = 1; d <= lastDate; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isToday = new Date().toISOString().split('T')[0] === dateStr;
            const hasData = serviceData[dateStr] ? 'has-data' : '';
            calendarDiv.innerHTML += `<div class="day ${isToday ? 'today' : ''} ${hasData}" onclick="openModal('${dateStr}')">${d}</div>`;
        }
    }

    function openModal(dateStr) {
        selectedDateStr = dateStr;
        document.getElementById('selectedDateText').innerText = dateStr;
        const data = serviceData[dateStr] || { hours: '', studies: '', notes: '' };
        document.getElementById('hours').value = data.hours;
        document.getElementById('studies').value = data.studies;
        document.getElementById('notes').value = data.notes;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function saveData() {
        serviceData[selectedDateStr] = {
            hours: document.getElementById('hours').value,
            studies: document.getElementById('studies').value,
            notes: document.getElementById('notes').value
        };
        localStorage.setItem('jw_service_data', JSON.stringify(serviceData));
        renderCalendar();
        closeModal();
    }

    function checkFirstOfMonth() {
        const today = new Date();
        if (today.getDate() === 1) {
            const lastMonthDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            const ym = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth() + 1).padStart(2, '0')}`;
            let h = 0, s = 0;
            Object.keys(serviceData).forEach(k => {
                if(k.startsWith(ym)) {
                    h += Number(serviceData[k].hours || 0);
                    s += Number(serviceData[k].studies || 0);
                }
            });
            alert(`[지난달 봉사 요약]\n시간 합계: ${h}시간\n연구 합계: ${s}건\n수고하셨습니다!`);
        }
    }

    function changeMonth(offset) {
        currentNavDate.setMonth(currentNavDate.getMonth() + offset);
        renderCalendar();
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(serviceData)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }

    init();
</script>
</body>
</html>
